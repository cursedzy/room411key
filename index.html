git<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room441 Links</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            cursor: grab;
        }

        body:active {
            cursor: grabbing;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
        }

        .fog-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: 
                radial-gradient(ellipse at center, transparent 0%, rgba(0,0,0,0.4) 70%, rgba(0,0,0,0.8) 100%);
            z-index: 10;
        }

        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.1) 0px,
                rgba(0, 0, 0, 0.1) 1px,
                transparent 1px,
                transparent 3px
            );
            z-index: 11;
            opacity: 0.3;
        }


        .channel-display {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #3a3a3a;
            font-size: 14px;
            letter-spacing: 4px;
            text-transform: uppercase;
            z-index: 20;
            text-shadow: 0 0 10px rgba(100, 100, 100, 0.3);
        }

        .instructions {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #595151;
            font-size: 14px;
            letter-spacing: 2px;
            z-index: 20;
            text-align: center;
        }

        #static-canvas {
            display: none;
        }

        .link-popup {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 25;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .link-popup.visible {
            opacity: 1;
        }

        .link-popup a {
            display: inline-block;
            padding: 10px 25px;
            background: rgba(20, 20, 20, 0.9);
            border: 1px solid #333;
            color: #666;
            text-decoration: none;
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .link-popup a:hover {
            background: rgba(40, 40, 40, 0.9);
            color: #999;
            border-color: #555;
            box-shadow: 0 0 20px rgba(100, 100, 100, 0.2);
        }


        @keyframes glitch {
            0% { transform: translateX(-50%) translate(0); }
            20% { transform: translateX(-50%) translate(-2px, 2px); }
            40% { transform: translateX(-50%) translate(-2px, -2px); }
            60% { transform: translateX(-50%) translate(2px, 2px); }
            80% { transform: translateX(-50%) translate(2px, -2px); }
            100% { transform: translateX(-50%) translate(0); }
        }

        .glitch {
            animation: glitch 0.1s infinite;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div class="fog-overlay"></div>
    <div class="scanlines"></div>
    <div class="channel-display">Channel <span id="channel-num">01</span></div>
    <div class="link-popup" id="link-popup">
        <a href="#" id="channel-link" target="_blank">Enter Gallery</a>
    </div>
    <div class="instructions">Drag to rotate | Click buttons on TV to see other links</div>
    <canvas id="static-canvas" width="512" height="384"></canvas>

    <script>

        const channels = [
            {
                image: 'https://hebbkx1anhila5yf.public.blob.vercel-storage.com/photo_2026-03-09_12-44-43-aJOTUqIVyZFijpqpXnvoIuXBeDi2Zh.jpg',
                link: 'https://example.com/moon-goddess',
                title: 'Instagram'
            },
            {
                image: 'https://hebbkx1anhila5yf.public.blob.vercel-storage.com/photo_2026-03-09_12-45-05-CDIeGACgBKzLoe4bQrZfi0PWRWM99x.jpg',
                link: 'https://pin.it/7Mf5HKfXr',
                title: 'Pinterest'
            },
            {
                image: 'https://hebbkx1anhila5yf.public.blob.vercel-storage.com/photo_2026-03-09_12-44-33-SWcyJmCk1Lm8FWha9dinDfVnp5V2KL.jpg',
                link: 'https://example.com/red-portrait',
                title: 'Inkarnate'
            },
            {
                image: 'https://hebbkx1anhila5yf.public.blob.vercel-storage.com/photo_2026-03-09_12-44-57-ldwVf5tTq2I0hKFGyAqcxmbmUX2MWQ.jpg',
                link: 'https://example.com/glitch',
                title: 'Boosty'
            }
        ];

        let currentChannel = 0;
        let isChangingChannel = false;
        let scene, camera, renderer, tv, screenMesh;
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let targetRotation = { x: 0, y: 0 };
        let currentRotation = { x: 0, y: 0 };
        let channelTextures = [];
        let staticTexture;
        let prevButton, nextButton;

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050505);
            scene.fog = new THREE.Fog(0x050505, 3, 22);

            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.5, 100);
            camera.position.set(0, 0.19, 7);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0x222222, 0.8);
            scene.add(ambientLight);

            const tvGlow = new THREE.PointLight(0x88aaff, 3.5, 6);
            tvGlow.position.set(0, 0, 2.5);
            scene.add(tvGlow);

            const tvGlow2 = new THREE.PointLight(0x6688cc, 2, 4);
            tvGlow2.position.set(-0.2, 0.1, 1.5);
            scene.add(tvGlow2);

            const rimLight = new THREE.DirectionalLight(0x443322, 0.5);
            rimLight.position.set(-2, 2, -2);
            scene.add(rimLight);

            const textureLoader = new THREE.TextureLoader();
            
            createStaticTexture();
            
            channels.forEach((channel, index) => {
                textureLoader.load(channel.image, (texture) => {
                    texture.minFilter = THREE.LinearFilter;
                    channelTextures[index] = texture;
                    if (index === 0 && screenMesh) {
                        screenMesh.material.map = texture;
                        screenMesh.material.needsUpdate = true;
                    }
                });
            });

            createTV();

            const floorGeo = new THREE.PlaneGeometry(20, 20);
            const floorMat = new THREE.MeshStandardMaterial({ 
                color: 0x080808,
                roughness: 0.9
            });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.position.y = -1.5;
            floor.receiveShadow = true;
            scene.add(floor);

            window.addEventListener('resize', onWindowResize);
            renderer.domElement.addEventListener('mousedown', onMouseDown);
            renderer.domElement.addEventListener('mousemove', onMouseMove);
            renderer.domElement.addEventListener('mouseup', onMouseUp);
            renderer.domElement.addEventListener('mouseleave', onMouseUp);
            renderer.domElement.addEventListener('touchstart', onTouchStart);
            renderer.domElement.addEventListener('touchmove', onTouchMove);
            renderer.domElement.addEventListener('touchend', onMouseUp);
            renderer.domElement.addEventListener('click', onCanvasClick);

            updateLinkPopup();
        }

        function createTV() {
            tv = new THREE.Group();

            const bodyMaterial = new THREE.MeshStandardMaterial({
                color: 0x5c3d2e,
                roughness: 0.6,
                metalness: 0.1
            });

            const darkPlasticMaterial = new THREE.MeshStandardMaterial({
                color: 0x3d2a1f,
                roughness: 0.7,
                metalness: 0.05
            });


            const bodyWidth = 2.4;
            const bodyHeight = 1.8;
            const bodyDepth = 1.6;


            const backGeo = new THREE.BoxGeometry(bodyWidth, bodyHeight, bodyDepth);
            const back = new THREE.Mesh(backGeo, bodyMaterial);
            back.position.z = -bodyDepth / 2 + 0.1;
            back.castShadow = true;
            tv.add(back);

            const bezelGeo = new THREE.BoxGeometry(bodyWidth + 0.1, bodyHeight + 0.1, 0.15);
            const bezel = new THREE.Mesh(bezelGeo, darkPlasticMaterial);
            bezel.position.z = 0.1;
            tv.add(bezel);


            const screenWidth = 1.6;
            const screenHeight = 1.2;
            const recessGeo = new THREE.BoxGeometry(screenWidth + 0.1, screenHeight + 0.1, 0.1);
            const recessMat = new THREE.MeshStandardMaterial({ color: 0x000000 });
            const recess = new THREE.Mesh(recessGeo, recessMat);
            recess.position.set(-0.2, 0.1, 0.15);
            tv.add(recess);

            const screenGeo = new THREE.PlaneGeometry(screenWidth, screenHeight);
            const screenMat = new THREE.MeshBasicMaterial({ 
                color: 0xffffff,
                side: THREE.FrontSide
            });
            screenMesh = new THREE.Mesh(screenGeo, screenMat);
            screenMesh.position.set(-0.2, 0.1, 0.21);
            tv.add(screenMesh);

            const glowGeo = new THREE.PlaneGeometry(screenWidth + 0.3, screenHeight + 0.3);
            const glowMat = new THREE.MeshBasicMaterial({ 
                color: 0x4488cc,
                transparent: true,
                opacity: 0.15
            });
            const screenGlow = new THREE.Mesh(glowGeo, glowMat);
            screenGlow.position.set(-0.2, 0.1, 0.19);
            tv.add(screenGlow);

            const glassGeo = new THREE.PlaneGeometry(screenWidth, screenHeight);
            const glassMat = new THREE.MeshBasicMaterial({ 
                color: 0xffffff,
                transparent: true,
                opacity: 0.03
            });
            const glass = new THREE.Mesh(glassGeo, glassMat);
            glass.position.set(-0.2, 0.1, 0.22);
            tv.add(glass);

            const buttonGeo = new THREE.CylinderGeometry(0.08, 0.08, 0.04, 16);
            const buttonMat = new THREE.MeshStandardMaterial({ 
                color: 0x2a2a2a,
                roughness: 0.9,
                metalness: 0.1
            });

            const prevBtnGeo = new THREE.CylinderGeometry(0.07, 0.07, 0.05, 16);
            prevButton = new THREE.Mesh(prevBtnGeo, buttonMat.clone());
            prevButton.rotation.x = Math.PI / 2;
            prevButton.position.set(0.95, -0.2, 0.2);
            prevButton.userData = { type: 'prev' };
            tv.add(prevButton);


            nextButton = new THREE.Mesh(prevBtnGeo.clone(), buttonMat.clone());
            nextButton.rotation.x = Math.PI / 2;
            nextButton.position.set(0.95, 0.2, 0.2);
            nextButton.userData = { type: 'next' };
            tv.add(nextButton);

            const triangleShape = new THREE.Shape();
            triangleShape.moveTo(0, 0.03);
            triangleShape.lineTo(-0.025, -0.02);
            triangleShape.lineTo(0.025, -0.02);
            triangleShape.lineTo(0, 0.03);

            const triangleGeo = new THREE.ShapeGeometry(triangleShape);
            const labelMat = new THREE.MeshBasicMaterial({ color: 0x444444 });

            const upLabel = new THREE.Mesh(triangleGeo, labelMat);
            upLabel.position.set(0.95, 0.2, 0.23);
            tv.add(upLabel);

            const downLabel = new THREE.Mesh(triangleGeo, labelMat);
            downLabel.rotation.z = Math.PI;
            downLabel.position.set(0.95, -0.2, 0.23);
            tv.add(downLabel);

            for (let i = 0; i < 6; i++) {
                const grillGeo = new THREE.BoxGeometry(0.3, 0.015, 0.01);
                const grillMat = new THREE.MeshStandardMaterial({ color: 0x0a0a0a });
                const grill = new THREE.Mesh(grillGeo, grillMat);
                grill.position.set(0.85, -0.55 + i * 0.04, 0.16);
                tv.add(grill);
            }


            const ledGeo = new THREE.SphereGeometry(0.015, 8, 8);
            const ledMat = new THREE.MeshBasicMaterial({ color: 0x331111 });
            const led = new THREE.Mesh(ledGeo, ledMat);
            led.position.set(0.95, 0.45, 0.18);
            tv.add(led);

            const antennaBaseMat = new THREE.MeshStandardMaterial({ 
                color: 0x2a2a2a,
                metalness: 0.5,
                roughness: 0.3
            });

            const antenna1 = new THREE.Group();
            const base1 = new THREE.CylinderGeometry(0.03, 0.04, 0.1, 8);
            const baseMesh1 = new THREE.Mesh(base1, antennaBaseMat);
            antenna1.add(baseMesh1);
            
            const rod1 = new THREE.CylinderGeometry(0.015, 0.015, 0.6, 8);
            const rodMesh1 = new THREE.Mesh(rod1, antennaBaseMat);
            rodMesh1.position.y = 0.35;
            rodMesh1.rotation.z = -0.3;
            antenna1.add(rodMesh1);
            
            antenna1.position.set(-0.7, bodyHeight / 2 + 0.05, -0.3);
            tv.add(antenna1);

            const antenna2 = antenna1.clone();
            antenna2.position.set(-0.3, bodyHeight / 2 + 0.05, -0.3);
            antenna2.children[1].rotation.z = 0.3;
            tv.add(antenna2);

            const footGeo = new THREE.BoxGeometry(0.3, 0.15, 0.4);
            const footMat = new THREE.MeshStandardMaterial({ 
                color: 0x3d2a1f,
                roughness: 0.8
            });

            const leftFoot = new THREE.Mesh(footGeo, footMat);
            leftFoot.position.set(-0.7, -bodyHeight / 2 - 0.05, -0.2);
            leftFoot.castShadow = true;
            tv.add(leftFoot);

            const rightFoot = new THREE.Mesh(footGeo, footMat);
            rightFoot.position.set(0.7, -bodyHeight / 2 - 0.05, -0.2);
            rightFoot.castShadow = true;
            tv.add(rightFoot);

            addDustParticles();

            scene.add(tv);
        }

        function addDustParticles() {
            const particleCount = 50;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);

            for (let i = 0; i < particleCount * 3; i += 3) {
                positions[i] = (Math.random() - 0.5) * 6;
                positions[i + 1] = (Math.random() - 0.5) * 4;
                positions[i + 2] = (Math.random() - 0.5) * 4;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

            const material = new THREE.PointsMaterial({
                color: 0x333333,
                size: 0.02,
                transparent: true,
                opacity: 0.3
            });

            const particles = new THREE.Points(geometry, material);
            scene.add(particles);
        }

        function createStaticTexture() {
            const canvas = document.getElementById('static-canvas');
            const ctx = canvas.getContext('2d');
            
            staticTexture = new THREE.CanvasTexture(canvas);
            staticTexture.minFilter = THREE.LinearFilter;
        }

        function updateStaticTexture() {
            const canvas = document.getElementById('static-canvas');
            const ctx = canvas.getContext('2d');
            const imageData = ctx.createImageData(canvas.width, canvas.height);
            const data = imageData.data;

            for (let i = 0; i < data.length; i += 4) {
                const noise = Math.random() * 255;
                if (Math.random() > 0.99) {
                    data[i] = 200;
                    data[i + 1] = 200;
                    data[i + 2] = 200;
                } else {
                    data[i] = noise * 0.3;
                    data[i + 1] = noise * 0.3;
                    data[i + 2] = noise * 0.35;
                }
                data[i + 3] = 255;
            }

            for (let y = 0; y < canvas.height; y += 3) {
                for (let x = 0; x < canvas.width; x++) {
                    const i = (y * canvas.width + x) * 4;
                    data[i] *= 0.7;
                    data[i + 1] *= 0.7;
                    data[i + 2] *= 0.7;
                }
            }

            ctx.putImageData(imageData, 0, 0);
            staticTexture.needsUpdate = true;
        }

        function changeChannel(direction) {
            if (isChangingChannel) return;
            isChangingChannel = true;

            const channelDisplay = document.getElementById('channel-num');
            const linkPopup = document.getElementById('link-popup');
            
            channelDisplay.parentElement.classList.add('glitch');
            linkPopup.classList.remove('visible');

            let staticFrames = 0;
            const maxStaticFrames = 15;
            
            const staticInterval = setInterval(() => {
                updateStaticTexture();
                screenMesh.material.map = staticTexture;
                screenMesh.material.needsUpdate = true;
                staticFrames++;

                if (staticFrames >= maxStaticFrames) {
                    clearInterval(staticInterval);
                    
                    if (direction === 'next') {
                        currentChannel = (currentChannel + 1) % channels.length;
                    } else {
                        currentChannel = (currentChannel - 1 + channels.length) % channels.length;
                    }

                    channelDisplay.textContent = String(currentChannel + 1).padStart(2, '0');
                    channelDisplay.parentElement.classList.remove('glitch');

                    if (channelTextures[currentChannel]) {
                        screenMesh.material.map = channelTextures[currentChannel];
                        screenMesh.material.needsUpdate = true;
                    }

                    updateLinkPopup();
                    isChangingChannel = false;
                }
            }, 50);
        }

        function updateLinkPopup() {
            const linkPopup = document.getElementById('link-popup');
            const channelLink = document.getElementById('channel-link');
            
            channelLink.href = channels[currentChannel].link;
            channelLink.textContent = channels[currentChannel].title;
            
            setTimeout(() => {
                linkPopup.classList.add('visible');
            }, 300);
        }

        function onCanvasClick(event) {
            const mouse = new THREE.Vector2();
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(mouse, camera);

            const intersects = raycaster.intersectObjects([prevButton, nextButton]);
            
            if (intersects.length > 0) {
                const clicked = intersects[0].object;
                if (clicked.userData.type === 'prev') {
                    // Visual feedback
                    clicked.material.color.setHex(0x444444);
                    setTimeout(() => clicked.material.color.setHex(0x2a2a2a), 150);
                    changeChannel('prev');
                } else if (clicked.userData.type === 'next') {
                    clicked.material.color.setHex(0x444444);
                    setTimeout(() => clicked.material.color.setHex(0x2a2a2a), 150);
                    changeChannel('next');
                }
            }
        }

        function onMouseDown(event) {
            isDragging = true;
            previousMousePosition = {
                x: event.clientX,
                y: event.clientY
            };
        }

        function onMouseMove(event) {
            if (!isDragging) return;

            const deltaMove = {
                x: event.clientX - previousMousePosition.x,
                y: event.clientY - previousMousePosition.y
            };

            targetRotation.y += deltaMove.x * 0.005;
            targetRotation.x += deltaMove.y * 0.003;

            // Clamp vertical rotation
            targetRotation.x = Math.max(-0.3, Math.min(0.3, targetRotation.x));

            previousMousePosition = {
                x: event.clientX,
                y: event.clientY
            };
        }

        function onMouseUp() {
            isDragging = false;
        }

        function onTouchStart(event) {
            if (event.touches.length === 1) {
                isDragging = true;
                previousMousePosition = {
                    x: event.touches[0].clientX,
                    y: event.touches[0].clientY
                };
            }
        }

        function onTouchMove(event) {
            if (!isDragging || event.touches.length !== 1) return;

            const deltaMove = {
                x: event.touches[0].clientX - previousMousePosition.x,
                y: event.touches[0].clientY - previousMousePosition.y
            };

            targetRotation.y += deltaMove.x * 0.005;
            targetRotation.x += deltaMove.y * 0.003;
            targetRotation.x = Math.max(-0.3, Math.min(0.3, targetRotation.x));

            previousMousePosition = {
                x: event.touches[0].clientX,
                y: event.touches[0].clientY
            };
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            currentRotation.x += (targetRotation.x - currentRotation.x) * 0.08;
            currentRotation.y += (targetRotation.y - currentRotation.y) * 0.08;

            if (tv) {
                tv.rotation.x = currentRotation.x;
                tv.rotation.y = currentRotation.y;
            }

            renderer.render(scene, camera);
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp' || e.key === 'ArrowRight') {
                changeChannel('next');
            } else if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') {
                changeChannel('prev');
            }
        });
    </script>
</body>
</html>
